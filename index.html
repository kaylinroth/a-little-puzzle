<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta property="og:title" content="A Little Puzzle">
<meta property="og:description" content="Can you solve it?">
<title>A Little Puzzle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: one centered play column, 4x4 tile grid, solved groups stack as soft bands, full-screen reveal on finish */
:root{
  --bg:#f3efe8; --surface:#e6dfd3; --surface-hi:#d9d1c3; --ink:#3b372f; --muted:#7a7266;
  --sel:#5a5447; --sel-ink:#faf7f1;
  --g1:#efdca2; --g2:#c5d4b4; --g3:#bcd0dc; --g4:#dcc4d6; --g-ink:#2f2c26;
  --display:"Fraunces", Georgia, serif;
  --body:"Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#211f1c; --surface:#34302a; --surface-hi:#423d35; --ink:#efe9de; --muted:#a69d8f;
  --sel:#e9e1d2; --sel-ink:#2a2723;
  --g1:#d9c27e; --g2:#a9bd96; --g3:#9db7c7; --g4:#c4a7bd; --g-ink:#211f1c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#211f1c; --surface:#34302a; --surface-hi:#423d35; --ink:#efe9de; --muted:#a69d8f;
  --sel:#e9e1d2; --sel-ink:#2a2723;
  --g1:#d9c27e; --g2:#a9bd96; --g3:#9db7c7; --g4:#c4a7bd; --g-ink:#211f1c; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;
  padding-inline:16px;padding-block:28px 48px}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{text-align:center;display:flex;flex-direction:column;gap:6px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(30px,8vw,42px);margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);margin:0;font-size:15px}

#board{display:flex;flex-direction:column;gap:8px}
.solved{display:flex;flex-direction:column;gap:8px}
.band{border-radius:10px;padding:12px 10px;text-align:center;color:var(--g-ink);animation:pop .35s ease}
.band b{display:block;font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:14px}
.band span{font-size:14px;text-transform:uppercase;letter-spacing:.03em}
.l1{background:var(--g1)}.l2{background:var(--g2)}.l3{background:var(--g3)}.l4{background:var(--g4)}

.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tile{appearance:none;border:0;border-radius:10px;background:var(--surface);color:var(--ink);
  font-family:var(--body);font-weight:800;text-transform:uppercase;letter-spacing:.02em;
  font-size:clamp(11px,3.1vw,16px);aspect-ratio:1.35/1;min-width:0;padding:4px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.1;
  overflow-wrap:anywhere;transition:background .15s,transform .1s,color .15s}
.tile:hover{background:var(--surface-hi)}
.tile:active{transform:scale(.96)}
.tile.on{background:var(--sel);color:var(--sel-ink)}
.tile:focus-visible,.btn:focus-visible{outline:3px solid var(--g3);outline-offset:2px}
.shake{animation:shake .4s}
.hop{animation:hop .35s}

.mistakes{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-size:15px}
.dots{display:flex;gap:6px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--sel);transition:opacity .3s,transform .3s}
.dot.gone{opacity:0;transform:scale(.3)}

.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{appearance:none;font-family:var(--body);font-weight:800;font-size:15px;border-radius:999px;
  padding:11px 20px;border:2px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn:disabled{opacity:.35;cursor:default}

#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 18px);transform:translateX(-50%);
  background:var(--ink);color:var(--bg);font-weight:800;padding:10px 18px;border-radius:8px;
  font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:5}
#toast.show{opacity:1}

#reveal{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;
  padding:24px 16px;z-index:4;overflow:auto}
#reveal .inner{max-width:520px;text-align:center;display:flex;flex-direction:column;gap:18px;align-items:center;position:relative;z-index:2}
.kicker{font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:800;margin:0}
.big{font-family:var(--display);font-weight:700;line-height:.95;margin:0;font-size:clamp(52px,16vw,96px);letter-spacing:-.02em}
.big span{display:block;opacity:0;transform:translateY(18px);animation:rise .7s forwards}
.big span:nth-child(2){animation-delay:.35s;font-style:italic;font-weight:500;color:var(--muted)}
.big{font-size:clamp(46px,14vw,84px)}
.big span:nth-child(3){animation-delay:.7s}
.clues{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:100%;opacity:0;animation:rise .6s 1.2s forwards}
.clues div{border-radius:10px;padding:10px;font-size:14px;font-weight:800;color:var(--g-ink)}
.note{color:var(--muted);margin:0;max-width:40ch;opacity:0;animation:rise .6s 1.4s forwards}
.note.late{animation-delay:1.9s}
.clues{animation-delay:1.6s}
.clues em{font-style:normal;text-decoration:underline;text-underline-offset:3px}
.photo{margin:0;background:var(--surface);padding:10px 10px 12px;border-radius:6px;transform:rotate(-2deg);
  box-shadow:0 10px 30px rgba(0,0,0,.15);width:min(280px,80%);opacity:0;animation:rise .7s 1.05s forwards}
.photo img{display:block;width:100%;border-radius:3px}
#reveal{align-items:flex-start}
#reveal .inner{margin:auto}
canvas#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}

@keyframes pop{from{transform:scale(.94);opacity:.4}to{transform:none;opacity:1}}
@keyframes rise{to{opacity:1;transform:none}}
@keyframes hop{50%{transform:translateY(-8px)}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;animation-delay:0s!important;transition:none!important}}
</style>
</head>
<body>

<main>
  <header>
    <h1>A Little Puzzle</h1>
    <p class="sub">Make four groups of four. Solve them all to find out a secret.</p>
  </header>
  <section id="board" aria-live="polite">
    <div class="solved" id="solved"></div>
    <div class="grid" id="grid"></div>
  </section>
  <div class="mistakes">Mistakes left: <div class="dots" id="dots"></div></div>
  <div class="controls">
    <button class="btn" id="shuffle">Shuffle</button>
    <button class="btn" id="clear">Deselect all</button>
    <button class="btn primary" id="submit" disabled>Submit</button>
  </div>
</main>
<div id="toast" role="status"></div>
<div id="reveal" hidden>
  <canvas id="confetti"></canvas>
  <div class="inner">
    <p class="kicker" id="kicker">You figured it out</p>

    <p class="note">Every group was missing the same word.</p>
    <div class="clues">
      <div class="l1"><em>Baby</em> teeth</div>
      <div class="l2"><em>Baby</em> bump</div>
      <div class="l3"><em>Baby</em> shower</div>
      <div class="l4"><em>Baby</em> steps</div>
    </div>
    <p class="note late">We can't wait for you to meet our little one.</p>
    <button class="btn" id="again">Play again</button>
  </div>
</div>

<script>
const GROUPS=[
  {lvl:1,name:"___ Teeth",words:["WISDOM","BUCK","SWEET","FALSE"]},
  {lvl:2,name:"___ Bump",words:["SPEED","GOOSE","FIST","CHEST"]},
  {lvl:3,name:"___ Shower",words:["RAIN","BRIDAL","METEOR","APRIL"]},
  {lvl:4,name:"___ Steps",words:["DANCE","NEXT","FRONT","TWELVE"]}
];
const MAX=4;
let tiles,sel,solved,left,guesses,over;
const $=id=>document.getElementById(id);

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(){
  tiles=shuffle(GROUPS.flatMap(g=>g.words));sel=new Set();solved=[];left=MAX;guesses=[];over=false;
  $("reveal").hidden=true;render();
}
function render(){
  $("solved").innerHTML=solved.map(g=>`<div class="band l${g.lvl}"><b>${g.name}</b><span>${g.words.join(", ")}</span></div>`).join("");
  $("grid").innerHTML="";
  tiles.forEach(w=>{
    const b=document.createElement("button");b.className="tile"+(sel.has(w)?" on":"");b.textContent=w;
    b.setAttribute("aria-pressed",sel.has(w));b.dataset.w=w;
    b.onclick=()=>{if(over)return;if(sel.has(w))sel.delete(w);else if(sel.size<4)sel.add(w);render()};
    $("grid").appendChild(b);
  });
  $("dots").innerHTML=Array.from({length:MAX},(_,i)=>`<span class="dot${i>=left?" gone":""}"></span>`).join("");
  $("submit").disabled=sel.size!==4||over;$("clear").disabled=sel.size===0||over;$("shuffle").disabled=over;
}
let tt;function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),1600)}
function selTiles(){return [...document.querySelectorAll(".tile.on")]}

$("submit").onclick=()=>{
  const pick=[...sel];const key=pick.slice().sort().join("|");
  if(guesses.includes(key)){toast("Already guessed!");return}
  guesses.push(key);
  const hit=GROUPS.find(g=>!solved.includes(g)&&g.words.every(w=>sel.has(w)));
  selTiles().forEach((t,i)=>setTimeout(()=>t.classList.add("hop"),i*80));
  setTimeout(()=>{
    if(hit){
      solved.push(hit);tiles=tiles.filter(w=>!sel.has(w));sel.clear();render();
      if(solved.length===4){over=true;render();setTimeout(()=>showReveal(true),700)}
    }else{
      const near=GROUPS.some(g=>!solved.includes(g)&&g.words.filter(w=>sel.has(w)).length===3);
      if(near)toast("One away...");
      selTiles().forEach(t=>t.classList.add("shake"));left--;
      setTimeout(()=>{render();if(left===0)lose()},450);
    }
  },420);
};
function lose(){
  over=true;toast("Out of guesses! Here are the answers.");
  const rest=GROUPS.filter(g=>!solved.includes(g));let i=0;
  const step=()=>{if(i<rest.length){solved.push(rest[i]);tiles=tiles.filter(w=>!rest[i].words.includes(w));i++;render();setTimeout(step,600)}
    else setTimeout(()=>showReveal(false),900)};
  setTimeout(step,800);
}
$("shuffle").onclick=()=>{shuffle(tiles);render()};
$("clear").onclick=()=>{sel.clear();render()};
$("again").onclick=start;

function showReveal(won){
  $("kicker").textContent=won?"You figured it out":"Close enough, here's the secret";
  const r=$("reveal");r.hidden=false;r.scrollTop=0;
  // restart text animations
  r.querySelectorAll(".big span,.clues,.note,.photo").forEach(el=>{el.style.animation="none";el.offsetHeight;el.style.animation=""});
  confetti();
}
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const c=$("confetti"),x=c.getContext("2d"),dpr=window.devicePixelRatio||1;
  const W=c.clientWidth,H=c.clientHeight;c.width=W*dpr;c.height=H*dpr;x.scale(dpr,dpr);
  const cs=getComputedStyle(document.documentElement);
  const cols=["--g1","--g2","--g3","--g4"].map(v=>cs.getPropertyValue(v).trim());
  const ps=Array.from({length:140},()=>({x:Math.random()*W,y:-20-Math.random()*H*.6,r:4+Math.random()*6,
    vy:1.5+Math.random()*2.5,vx:-1+Math.random()*2,a:Math.random()*6,va:-.1+Math.random()*.2,c:cols[Math.floor(Math.random()*4)],round:Math.random()<.4}));
  let f=0;(function tick(){x.clearRect(0,0,W,H);
    ps.forEach(p=>{p.y+=p.vy;p.x+=p.vx+Math.sin((f+p.a*20)/30)*.6;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;
      if(p.round){x.beginPath();x.arc(0,0,p.r*.6,0,7);x.fill()}else x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});
    if(++f<420&&!$("reveal").hidden)requestAnimationFrame(tick);else x.clearRect(0,0,W,H)})();
}
start();
</script>
